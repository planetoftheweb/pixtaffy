name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or ref). New pushes to a PR cancel its older run; pushes to
# main and manual runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test, build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
        if: matrix.check == 'typecheck'
      # Build validation uses placeholders. This workflow never deploys its output.
      # Output is saved so the test count guard below can prove tests really ran.
      - name: Run npm run ${{ matrix.check }}
        run: |
          set -o pipefail
          npm run ${{ matrix.check }} 2>&1 | tee ci-output.log
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
      # test and build (prebuild runs npm test) must report at least one test.
      - name: Test count guard
        if: always() && (matrix.check == 'test' || matrix.check == 'build')
        run: node scripts/ci-test-counts.mjs ci-output.log test-counts-${{ matrix.check }}.json
      - name: Upload test counts
        if: always() && (matrix.check == 'test' || matrix.check == 'build')
        uses: actions/upload-artifact@v6
        with:
          name: test-counts-${{ matrix.check }}
          path: test-counts-${{ matrix.check }}.json
          if-no-files-found: warn

  emulator:
    name: emulator tests (rules + key store)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm install -g firebase-tools
      # Runs only against local emulators with the demo-pixtaffy project.
      # No real secrets: the encryption key below is a fake, test-only value.
      - name: Run npm run test:emulator
        run: |
          set -o pipefail
          npm run test:emulator 2>&1 | tee ci-output.log
        env:
          REQUIRE_EMULATOR_TESTS: '1'
          USER_API_KEYS_TEST_ENCRYPTION_KEY: fake-ci-only-test-encryption-key-not-a-secret
      # Emulator tests must run for real: fail on 0 tests or on any skipped test.
      - name: Test count guard
        if: always()
        run: node scripts/ci-test-counts.mjs ci-output.log test-counts-emulator-tests-rules-key-store.json --fail-on-skipped
      - name: Upload test counts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-counts-emulator-tests-rules-key-store
          path: test-counts-emulator-tests-rules-key-store.json
          if-no-files-found: warn

  # Single required check: fails unless every job above succeeded. A job that is
  # missing, skipped, cancelled, or failed makes this fail too.
  ci-complete:
    name: ci-complete
    if: always()
    needs: [validate, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS || "{}");
            const entries = Object.entries(needs);
            if (!entries.length) { console.log("No upstream jobs found"); process.exit(1); }
            let ok = true;
            for (const [job, info] of entries) {
              console.log(`${job}: ${info.result}`);
              if (info.result !== "success") ok = false;
            }
            process.exit(ok ? 0 : 1);
          '
